<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-label="Árvore de métricas do teste da recomendação de HS: a métrica principal, os dois guardrails e as leituras de substituição, com o papel de cada uma." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="566" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><rect x="250" y="20" width="700" height="62" rx="12" fill="#FFFFFF" stroke="#40002D" stroke-width="1.4"/><text x="600" y="57" font-size="16.5" fill="#141414" font-weight="700" text-anchor="middle">A recomendação leva consultas para HS priorizados sem custo a mais?</text><line x1="600" y1="82" x2="600" y2="104" stroke="#827667" stroke-width="1.3"/><line x1="157.5" y1="104" x2="1042.5" y2="104" stroke="#827667" stroke-width="1.3"/><line x1="157.5" y1="104" x2="157.5" y2="128" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><line x1="452.5" y1="104" x2="452.5" y2="128" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><line x1="747.5" y1="104" x2="747.5" y2="128" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><line x1="1042.5" y1="104" x2="1042.5" y2="128" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><rect x="20" y="130" width="275" height="318" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><rect x="36" y="146" width="82.73937500000001" height="26" rx="13" fill="#BE0380"/><text x="48" y="164" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Principal</text><text x="36" y="194" font-size="12.5" fill="#BE0380" font-weight="600" text-anchor="start">decide o teste</text><text x="36" y="224" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Share de consultas em HS</text><text x="36" y="244" font-size="15" fill="#141414" font-weight="700" text-anchor="start">priorizado</text><circle cx="40" cy="266" r="2.5" fill="#827667"/><text x="50" y="270.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">tratamento contra controle</text><text x="36" y="296.46" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">é a pergunta do teste em um número</text><rect x="315" y="130" width="275" height="318" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><rect x="331" y="146" width="143.81" height="26" rx="13" fill="#690046"/><text x="343" y="164" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Guardrail de custo</text><text x="331" y="194" font-size="12.5" fill="#690046" font-weight="600" text-anchor="start">pode pausar o teste</text><text x="331" y="224" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Custo de consulta com</text><text x="331" y="244" font-size="15" fill="#141414" font-weight="700" text-anchor="start">especialista</text><circle cx="335" cy="266" r="2.5" fill="#827667"/><text x="345" y="270.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">por membro, tratamento contra</text><text x="345" y="288.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">controle</text><circle cx="335" cy="308.92" r="2.5" fill="#827667"/><text x="345" y="312.92" font-size="13" fill="#333333" font-weight="400" text-anchor="start">se o tratamento descolar para</text><text x="345" y="331.38" font-size="13" fill="#333333" font-weight="400" text-anchor="start">cima, pausa, mesmo com a</text><text x="345" y="349.84000000000003" font-size="13" fill="#333333" font-weight="400" text-anchor="start">principal boa</text><text x="331" y="376.3" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">limiar ainda em aberto</text><rect x="610" y="130" width="275" height="318" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><rect x="626" y="146" width="180.19250000000002" height="26" rx="13" fill="#690046"/><text x="638" y="164" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Guardrail de perdedores</text><text x="626" y="194" font-size="12.5" fill="#690046" font-weight="600" text-anchor="start">pode pausar o teste</text><text x="626" y="224" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Concentração nos mais</text><text x="626" y="244" font-size="15" fill="#141414" font-weight="700" text-anchor="start">recomendados</text><circle cx="630" cy="266" r="2.5" fill="#827667"/><text x="640" y="270.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">quantos profissionais a feature</text><text x="640" y="288.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">recomenda e quanto fica com os</text><text x="640" y="306.92" font-size="13" fill="#333333" font-weight="400" text-anchor="start">cinco mais recomendados</text><circle cx="630" cy="327.38" r="2.5" fill="#827667"/><text x="640" y="331.38" font-size="13" fill="#333333" font-weight="400" text-anchor="start">se subir de forma sustentada, o</text><text x="640" y="349.84" font-size="13" fill="#333333" font-weight="400" text-anchor="start">ranking virou funil</text><text x="626" y="376.3" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">limiar ainda em aberto</text><rect x="905" y="130" width="275" height="318" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><rect x="921" y="146" width="107.71625000000002" height="26" rx="13" fill="#5B2263"/><text x="933" y="164" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Substituição</text><text x="921" y="194" font-size="12.5" fill="#5B2263" font-weight="600" text-anchor="start">explica o resultado</text><text x="921" y="224" font-size="15" fill="#141414" font-weight="700" text-anchor="start">A feature cria valor ou só</text><text x="921" y="244" font-size="15" fill="#141414" font-weight="700" text-anchor="start">desloca?</text><circle cx="925" cy="266" r="2.5" fill="#827667"/><text x="935" y="270.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">pedido de indicação no SI,</text><text x="935" y="288.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">tratamento contra controle</text><circle cx="925" cy="308.92" r="2.5" fill="#827667"/><text x="935" y="312.92" font-size="13" fill="#333333" font-weight="400" text-anchor="start">rotas até o especialista: feature,</text><text x="935" y="331.38" font-size="13" fill="#333333" font-weight="400" text-anchor="start">canal humano e rede</text><circle cx="925" cy="351.84000000000003" r="2.5" fill="#827667"/><text x="935" y="355.84000000000003" font-size="13" fill="#333333" font-weight="400" text-anchor="start">caminho que levou a cada consulta</text><text x="921" y="382.3" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">só a primeira compara braços; as</text><text x="921" y="400.05" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">outras duas descrevem quem tem</text><text x="921" y="417.8" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">acesso</text><rect x="20" y="466" width="1160" height="72" rx="12" fill="#FFFFFF" stroke="#40002D" stroke-width="1.4"/><text x="34" y="491.7" font-size="15" fill="#40002D" font-weight="700" text-anchor="start">Comum aos quatro: a comparação é entre braços sorteados</text><text x="34" y="514.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Poucos sorteados acionam a feature, então o efeito chega diluído na comparação entre braços, e os cards ainda não acusam nada por desenho, e não por defeito.</text></svg>