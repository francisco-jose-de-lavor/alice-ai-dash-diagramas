<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 446" width="1200" height="446" role="img" aria-label="Duas populações de canais e a parte de cada uma com desfecho registrado: do lado da Alice AI, só os canais com handoff entram na taxa de resolução." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="446" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><text x="20" y="68" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Com Alice AI</text><rect x="300" y="40" width="524.0" height="44" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1" stroke-dasharray="5 4"/><text x="316" y="68" font-size="13.5" fill="#333333" font-weight="600" text-anchor="start">contidos, sem handoff</text><rect x="828.0" y="40" width="348.0" height="44" rx="8" fill="#BE0380"/><text x="844.0" y="68" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="start">com handoff</text><text x="316" y="108" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">sem desfecho registrado: fica fora da conta</text><text x="844.0" y="108" font-size="13" fill="#BE0380" font-weight="700" text-anchor="start">a taxa da Alice AI sai só daqui</text><text x="844.0" y="126" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">o desfecho é registrado no handoff</text><text x="20" y="196" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Sem Alice AI</text><rect x="300" y="168" width="656.0" height="44" rx="8" fill="#690046"/><text x="316" y="196" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="start">com desfecho registrado</text><rect x="960.0" y="168" width="216.0" height="44" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1" stroke-dasharray="5 4"/><text x="976.0" y="196" font-size="13.5" fill="#333333" font-weight="600" text-anchor="start">sem desfecho</text><text x="316" y="236" font-size="13" fill="#690046" font-weight="700" text-anchor="start">a taxa sem a Alice AI sai daqui</text><rect x="300" y="268" width="14" height="14" rx="3" fill="#690046"/><text x="322" y="280" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">entra no denominador da taxa</text><rect x="530" y="268" width="14" height="14" rx="3" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><text x="552" y="280" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">fica fora</text><text x="1180" y="280" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="end" font-style="italic">proporções ilustrativas</text><rect x="20" y="306" width="1160" height="111" rx="12" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.4"/><text x="36" y="333.7" font-size="15" fill="#BE0380" font-weight="700" text-anchor="start">Os contidos, onde a Alice AI resolve sozinha, nunca entram na taxa</text><text x="36" y="356.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Do lado da Alice AI, a taxa descreve só os canais que caíram para humano, o pior subconjunto do produto. Taxa alta com cobertura baixa é amostra enviesada, e não resolução</text><text x="36" y="374.65999999999997" font-size="13" fill="#333333" font-weight="400" text-anchor="start">alta.</text><text x="36" y="393.11999999999995" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">Resolvido: desfecho clínico Resolutivo ou, nos canais administrativos, resposta Sim em "Esse atendimento resolveu sua demanda?".</text></svg>