<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 706" width="1200" height="706" role="img" aria-label="Quem entra em cada lado da comparação de custo com e sem a Alice AI, e quais capítulos cada opção do filtro Natureza do custo deixa no numerador." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="706" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><rect x="20" y="16" width="1160" height="330" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="40" y="46" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Base com plano vigente no dia 1 do mês</text><text x="1160" y="46" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="end">é a linha Geral do gráfico por grupo</text><rect x="44" y="64" width="1112" height="264" rx="12" fill="#FAFAFA" stroke="#690046" stroke-width="1.2"/><text x="64" y="94" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Abriu algum canal no Alice Agora no mês</text><text x="1136" y="94" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="end">é o universo das comparações com e sem a Alice AI</text><rect x="70" y="114" width="480" height="88" rx="12" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.4"/><text x="86" y="141.7" font-size="15" fill="#BE0380" font-weight="700" text-anchor="start">Passou pela Alice AI</text><text x="86" y="164.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">ao menos um canal do mês teve a Alice AI</text><text x="600" y="166" font-size="26" fill="#6F6F6F" font-weight="400" text-anchor="middle">×</text><rect x="650" y="114" width="480" height="88" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="666" y="141.7" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Só fora da Alice AI</text><text x="666" y="164.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">abriu canal no mês, e nenhum teve a Alice AI</text><text x="70" y="234" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">Em cada lado: custo do mês ÷ membros do lado no mês. Membro sem custo no mês entra como zero.</text><circle cx="76" cy="264" r="4" fill="#BE0380"/><text x="88" y="268" font-size="13" fill="#333333" font-weight="400" text-anchor="start">controla: os dois lados buscaram atendimento no mês</text><circle cx="76" cy="292" r="4" fill="#40002D"/><text x="88" y="296" font-size="13" fill="#333333" font-weight="400" text-anchor="start">não controla: quem passou pela Alice AI escolheu usar; o efeito causal só sai do A/B do rollout</text><text x="20" y="384" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Natureza do custo: quais capítulos entram no numerador</text><text x="436.0" y="418" font-size="13" fill="#141414" font-weight="700" text-anchor="middle">Agudo de entrada</text><text x="436.0" y="436" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="middle">PS, PA Digital, Triagem</text><text x="648.0" y="418" font-size="13" fill="#141414" font-weight="700" text-anchor="middle">Ambulatorial</text><text x="648.0" y="436" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="middle">consultas, exames, terapias</text><text x="860.0" y="418" font-size="13" fill="#141414" font-weight="700" text-anchor="middle">Internação e procedimento</text><text x="860.0" y="436" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="middle">uma conversa não move</text><text x="1072.0" y="418" font-size="13" fill="#141414" font-weight="700" text-anchor="middle">Demais capítulos</text><text x="1072.0" y="436" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="middle">o restante da conta</text><text x="20" y="477" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">Todo o custo</text><text x="121.37205" y="477" font-size="12.5" fill="#BE0380" font-weight="600" text-anchor="start">é o CUt</text><rect x="348" y="460" width="176" height="24" rx="6" fill="#BE0380"/><rect x="560" y="460" width="176" height="24" rx="6" fill="#BE0380"/><rect x="772" y="460" width="176" height="24" rx="6" fill="#BE0380"/><rect x="984" y="460" width="176" height="24" rx="6" fill="#BE0380"/><text x="20" y="517" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">Sem internação e procedimento</text><rect x="348" y="500" width="176" height="24" rx="6" fill="#690046"/><rect x="560" y="500" width="176" height="24" rx="6" fill="#690046"/><rect x="772" y="500" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><rect x="984" y="500" width="176" height="24" rx="6" fill="#690046"/><text x="20" y="557" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">Só agudo de entrada</text><rect x="348" y="540" width="176" height="24" rx="6" fill="#690046"/><rect x="560" y="540" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><rect x="772" y="540" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><rect x="984" y="540" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><text x="20" y="597" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">Só ambulatorial</text><rect x="348" y="580" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><rect x="560" y="580" width="176" height="24" rx="6" fill="#690046"/><rect x="772" y="580" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><rect x="984" y="580" width="176" height="24" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><rect x="330" y="622" width="14" height="14" rx="3" fill="#690046"/><text x="352" y="634" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">entra no numerador</text><rect x="500" y="622" width="14" height="14" rx="3" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><text x="522" y="634" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">fica fora</text><text x="20" y="668.0" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">Fora de Todo o custo, o número é o custo do recorte, não o CUt, e não se compara com o CUt do fórum. O custo vem da conta viva: fica um pouco acima do publicado, e meses recentes</text><text x="20" y="685.75" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">ainda podem subir.</text></svg>