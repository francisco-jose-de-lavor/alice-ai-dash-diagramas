<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Como o membro ganha acesso à Alice AI (sorteio da recomendação de HS, convite ao opt-in ou Pitaya) e em qual grupo do filtro Grupo de membros ele cai." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="660" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><text x="20" y="32" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Como o membro ganha acesso</text><text x="900" y="32" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Grupo no filtro Grupo de membros</text><rect x="20" y="215" width="170" height="90" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="36" y="242.7" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Base de</text><text x="36" y="262.2" font-size="15" fill="#141414" font-weight="700" text-anchor="start">membros</text><text x="36" y="284.7" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">elegíveis ao produto</text><rect x="230" y="56" width="330" height="138" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="246" y="83.7" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Sorteio da recomendação de HS</text><text x="246" y="106.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">acontece quando o membro abre o app</text><text x="246" y="124.66" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">o braço sorteado não muda depois</text><rect x="600" y="56" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#BE0380" stroke-width="1.4"/><text x="614" y="81.31" font-size="14.5" fill="#BE0380" font-weight="700" text-anchor="start">Tratamento</text><text x="614" y="103.16" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Alice AI com indicação de HS</text><rect x="600" y="130" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="614" y="155.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Controle</text><text x="614" y="177.16" font-size="13" fill="#333333" font-weight="400" text-anchor="start">fica no Agente 00, sem a Alice AI</text><line x1="560" y1="125" x2="597" y2="90" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><line x1="560" y1="125" x2="597" y2="160" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="226" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="246" y="253.7" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Convite ao opt-in</text><text x="246" y="276.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">enviado a um lote da base elegível</text><rect x="600" y="226" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#690046" stroke-width="1.4"/><text x="614" y="251.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Aceite</text><text x="614" y="273.16" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Alice AI completa</text><text x="614" y="291.62" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">quem aceita escolheu aceitar</text><line x1="560" y1="276" x2="597" y2="276" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="358" width="630" height="78" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="244" y="383.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Pitayas</text><text x="244" y="405.16" font-size="13" fill="#333333" font-weight="400" text-anchor="start">colaboradores e dependentes, com acesso desde o alfa, fora do sorteio e do convite</text><line x1="190" y1="260" x2="227" y2="125" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><line x1="190" y1="260" x2="227" y2="276" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><line x1="190" y1="260" x2="227" y2="397" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="900" y="50" width="280" height="150" rx="12" fill="#F6EEF4" stroke="#690046" stroke-width="1.2"/><text x="916" y="166" font-size="13" fill="#141414" font-weight="600" text-anchor="start">Recomendação de HS</text><text x="916" y="184" font-size="13" fill="#141414" font-weight="600" text-anchor="start">[Controle + Tratamento]</text><rect x="914" y="62" width="252" height="60" rx="9" fill="#FFFFFF" stroke="#BE0380" stroke-width="1.4"/><text x="930" y="87" font-size="13" fill="#BE0380" font-weight="600" text-anchor="start">Recomendação de HS</text><text x="930" y="105" font-size="13" fill="#BE0380" font-weight="600" text-anchor="start">[Tratamento]</text><line x1="860" y1="88" x2="912" y2="88" stroke="#BE0380" stroke-width="1.3" marker-end="url(#ahm)"/><line x1="860" y1="162" x2="898" y2="162" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="900" y="216" width="280" height="120" rx="12" fill="#F6EEF4" stroke="#690046" stroke-width="1.2"/><text x="916" y="320" font-size="13" fill="#141414" font-weight="600" text-anchor="start">Base convidada ao opt-in</text><rect x="914" y="228" width="252" height="60" rx="9" fill="#FFFFFF" stroke="#690046" stroke-width="1.4"/><text x="930" y="263" font-size="13" fill="#690046" font-weight="600" text-anchor="start">Base com aceite do opt-in</text><line x1="860" y1="258" x2="912" y2="258" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="900" y="358" width="130" height="78" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="916" y="402" font-size="13" fill="#141414" font-weight="600" text-anchor="start">Pitayas</text><rect x="1042" y="358" width="138" height="78" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="1056" y="392" font-size="13" fill="#141414" font-weight="600" text-anchor="start">Não Pitayas</text><text x="1056" y="411" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="start">o resto da base</text><line x1="860" y1="397" x2="898" y2="397" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="900" y="452" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="916" y="477" font-size="13" fill="#141414" font-weight="600" text-anchor="start">Quem usou a indicação de HS</text><text x="916" y="497" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="start">recebeu o card, por qualquer porta</text><rect x="20" y="548" width="540" height="92" rx="12" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.4"/><text x="34" y="573.31" font-size="14.5" fill="#BE0380" font-weight="700" text-anchor="start">Só o sorteio permite ler diferença entre grupos como efeito</text><text x="34" y="595.16" font-size="13" fill="#333333" font-weight="400" text-anchor="start">No convite, quem aceita escolheu aceitar; entre Pitayas e o resto da base, o</text><text x="34" y="613.62" font-size="13" fill="#333333" font-weight="400" text-anchor="start">perfil é outro.</text><rect x="580" y="548" width="600" height="92" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><circle cx="598" cy="573" r="2.5" fill="#827667"/><text x="608" y="577" font-size="13" fill="#333333" font-weight="400" text-anchor="start">[Controle + Tratamento] inclui convidados ao opt-in, postos no controle sem sorteio</text><circle cx="598" cy="595" r="2.5" fill="#827667"/><text x="608" y="599" font-size="13" fill="#333333" font-weight="400" text-anchor="start">o mesmo membro pode estar em mais de um grupo</text><circle cx="598" cy="617" r="2.5" fill="#827667"/><text x="608" y="621" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Todos os membros é o filtro desligado, não um grupo</text></svg>