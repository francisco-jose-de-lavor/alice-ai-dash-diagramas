<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" width="1200" height="262" role="img" aria-label="Lembrete: os números do teste de lançamento já aparecem, mas cada leitura só vale quando amadurece. Linha do tempo com as datas estimadas de maturação: início em 21/10, 10 mil no tratamento por volta de 06/11, primeira leitura por volta de 07/12, leitura principal por volta de 04/01 e custo e desfechos por volta de 08/03." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="262" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><text x="24" y="36" font-size="18" fill="#141414" font-weight="700" text-anchor="start">Lembrete: os números já aparecem, mas cada leitura só vale quando amadurece</text><text x="24" y="60" font-size="13.5" fill="#6F6F6F" font-weight="400" text-anchor="start">As datas são estimativas de maturação da leitura e podem se mover com o ritmo de entrada no teste.</text><rect x="44" y="98" width="604.3478260869565" height="30" rx="15" fill="#FBF0F7"/><text x="60" y="118" font-size="13" fill="#690046" font-weight="600" text-anchor="start">Acompanhamento: a diferença ainda pode mudar de lado</text><rect x="648.3478260869565" y="98" width="507.6521739130435" height="30" rx="15" fill="#F3F2F0"/><text x="664.3478260869565" y="118" font-size="13" fill="#6F6F6F" font-weight="600" text-anchor="start">Custo e desfechos seguem amadurecendo</text><line x1="44" y1="152" x2="1156" y2="152" stroke="#CEC6B9" stroke-width="3"/><circle cx="44.0" cy="152" r="7" fill="#40002D"/><text x="37.0" y="186" font-size="15" fill="#40002D" font-weight="700" text-anchor="start">21/10</text><text x="37.0" y="206" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">Início do teste</text><circle cx="172.92753623188406" cy="152" r="6" fill="#E2D7E0" stroke="#FFFFFF" stroke-width="0"/><text x="166.92753623188406" y="186" font-size="15" fill="#6F6F6F" font-weight="700" text-anchor="start">~06/11</text><text x="166.92753623188406" y="206" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">10 mil no tratamento</text><circle cx="422.72463768115944" cy="152" r="8" fill="#FFFFFF" stroke="#BE0380" stroke-width="3"/><text x="422.72463768115944" y="186" font-size="15" fill="#BE0380" font-weight="700" text-anchor="middle">~07/12</text><text x="422.72463768115944" y="206" font-size="13.5" fill="#141414" font-weight="600" text-anchor="middle">Primeira leitura</text><text x="422.72463768115944" y="224" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">uso nas semanas 2 a 4</text><circle cx="648.3478260869565" cy="152" r="11" fill="#BE0380"/><text x="648.3478260869565" y="186" font-size="15" fill="#BE0380" font-weight="700" text-anchor="middle">~04/01</text><text x="648.3478260869565" y="206" font-size="13.5" fill="#141414" font-weight="600" text-anchor="middle">Leitura principal</text><text x="648.3478260869565" y="224" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">decide o teste</text><circle cx="1156.0" cy="152" r="8" fill="#690046"/><text x="1164.0" y="186" font-size="15" fill="#690046" font-weight="700" text-anchor="end">~08/03</text><text x="1164.0" y="206" font-size="13.5" fill="#141414" font-weight="600" text-anchor="end">Custo e desfechos</text><text x="1164.0" y="224" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="end">CUt, PS e internação</text></svg>