<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Caminho da conversa com a Alice AI até a consulta com o especialista, as pontes de dado entre as etapas e onde começa e termina cada um dos três funis de indicação." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="560" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><rect x="20" y="30" width="160" height="126" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="34" y="55.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Conversa</text><text x="34" y="77.16" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">conversa real tem</text><text x="34" y="94.91" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">duas ou mais</text><text x="34" y="112.66" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">mensagens do</text><text x="34" y="130.41" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">membro</text><line x1="182" y1="90" x2="207" y2="90" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="210" y="30" width="160" height="126" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="224" y="55.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Pede uma</text><text x="224" y="74.16" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">especialidade</text><text x="224" y="96.00999999999999" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">cada par canal ×</text><text x="224" y="113.75999999999999" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">especialidade é uma</text><text x="224" y="131.51" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">busca</text><line x1="372" y1="90" x2="397" y2="90" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="400" y="30" width="160" height="126" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="414" y="55.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Indicação</text><line x1="562" y1="90" x2="587" y2="90" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="590" y="30" width="160" height="126" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="604" y="55.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Clique</text><text x="604" y="77.16" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">ver perfil ou agendar</text><line x1="752" y1="90" x2="777" y2="90" stroke="#827667" stroke-width="1.4" marker-end="url(#ah)"/><rect x="780" y="30" width="160" height="126" rx="12" fill="#FFFFFF" stroke="#690046" stroke-width="1.4"/><text x="794" y="55.31" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Consulta</text><text x="794" y="77.16" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">na especialidade</text><text x="794" y="94.91" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">buscada, em até 30</text><text x="794" y="112.66" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">dias</text><rect x="414" y="76" width="36" height="30" rx="7" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.1"/><text x="432" y="96" font-size="13" fill="#BE0380" font-weight="700" text-anchor="middle">1</text><rect x="458" y="76" width="36" height="30" rx="7" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.1"/><text x="476" y="96" font-size="13" fill="#BE0380" font-weight="700" text-anchor="middle">2</text><rect x="502" y="76" width="36" height="30" rx="7" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.1"/><text x="520" y="96" font-size="13" fill="#BE0380" font-weight="700" text-anchor="middle">3</text><text x="414" y="132" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="start">card com os</text><text x="414" y="148" font-size="12" fill="#6F6F6F" font-weight="400" text-anchor="start">indicados, por posição</text><line x1="670" y1="156" x2="670" y2="180" stroke="#827667" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="420" y="180" width="340" height="67" rx="12" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.2"/><text x="434" y="205.7" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">o clique não traz o canal: vai para o último canal</text><text x="434" y="223.45" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">que o membro abriu antes dele</text><line x1="860" y1="156" x2="860" y2="180" stroke="#827667" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="780" y="180" width="400" height="67" rx="12" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.2"/><text x="794" y="205.7" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">a consulta casa pelo mesmo profissional e pela</text><text x="794" y="223.45" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">especialidade, na conta médica</text><text x="20" y="290" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Três funis sobre o mesmo caminho</text><text x="94.0" y="328" font-size="13" fill="#BE0380" font-weight="700" text-anchor="start">Recomendação HS · por membro</text><line x1="100.0" y1="340" x2="860.0" y2="340" stroke="#BE0380" stroke-width="2.4"/><circle cx="100.0" cy="340" r="6" fill="#FFFFFF" stroke="#BE0380" stroke-width="2.2"/><circle cx="480.0" cy="340" r="6" fill="#FFFFFF" stroke="#BE0380" stroke-width="2.2"/><circle cx="670.0" cy="340" r="6" fill="#FFFFFF" stroke="#BE0380" stroke-width="2.2"/><circle cx="860.0" cy="340" r="6" fill="#FFFFFF" stroke="#BE0380" stroke-width="2.2"/><circle cx="860.0" cy="340" r="6" fill="#BE0380"/><text x="890" y="344.0" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">termina em: consultou um profissional</text><text x="890" y="361.75" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">recomendado</text><text x="474.0" y="390" font-size="13" fill="#690046" font-weight="700" text-anchor="start">Direcionamento · por membro</text><line x1="480.0" y1="402" x2="860.0" y2="402" stroke="#690046" stroke-width="2.4"/><circle cx="480.0" cy="402" r="6" fill="#FFFFFF" stroke="#690046" stroke-width="2.2"/><circle cx="670.0" cy="402" r="6" fill="#FFFFFF" stroke="#690046" stroke-width="2.2"/><circle cx="860.0" cy="402" r="6" fill="#FFFFFF" stroke="#690046" stroke-width="2.2"/><circle cx="860.0" cy="402" r="6" fill="#690046"/><text x="890" y="406.0" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">termina em: consultou o profissional que clicou</text><text x="474.0" y="452" font-size="13" fill="#5B2263" font-weight="700" text-anchor="start">Direcionamento · por busca, canal × especialidade</text><line x1="480.0" y1="464" x2="860.0" y2="464" stroke="#5B2263" stroke-width="2.4"/><circle cx="480.0" cy="464" r="6" fill="#FFFFFF" stroke="#5B2263" stroke-width="2.2"/><circle cx="670.0" cy="464" r="6" fill="#FFFFFF" stroke="#5B2263" stroke-width="2.2"/><circle cx="860.0" cy="464" r="6" fill="#FFFFFF" stroke="#5B2263" stroke-width="2.2"/><circle cx="860.0" cy="464" r="6" fill="#5B2263"/><text x="890" y="468.0" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">termina em: consultou qualquer um dos</text><text x="890" y="485.75" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start">exibidos</text><text x="20" y="534" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">As etapas de consulta são piso: a coorte precisa de 30 dias, e a conta médica chega com atraso.</text></svg>