<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-label="Três comparações de substituição de PS pelo PA Digital, o que cada uma responde e o que não responde." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="586" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><text x="20" y="34" font-size="16" fill="#141414" font-weight="700" text-anchor="start">Substituição = PA Digital ÷ (PA Digital + Pronto Socorro)</text><text x="1180" y="34" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="end">cada linha compara grupos diferentes</text><text x="76" y="76" font-size="13" fill="#6F6F6F" font-weight="700" text-anchor="start">Compara</text><text x="580" y="76" font-size="13" fill="#6F6F6F" font-weight="700" text-anchor="start">Responde</text><text x="880" y="76" font-size="13" fill="#6F6F6F" font-weight="700" text-anchor="start">Não responde</text><rect x="20" y="90" width="1160" height="142" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><circle cx="44" cy="116" r="11" fill="#40002D"/><text x="44" y="120.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="76" y="121" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Quem aceitou o opt-in contra ela mesma antes</text><text x="580" y="121.0" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">A substituição mudou para quem</text><text x="580" y="140.17" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">aceitou?</text><text x="880" y="121.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Se a mudança veio da Alice AI: aceitar é</text><text x="880" y="139.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">escolha, e o aceite vem logo depois de uma</text><text x="880" y="157.92000000000002" font-size="13" fill="#333333" font-weight="400" text-anchor="start">piora, por isso os 30 dias anteriores saem</text><text x="880" y="176.38" font-size="13" fill="#333333" font-weight="400" text-anchor="start">da base.</text><line x1="560" y1="104" x2="560" y2="218" stroke="#CEC6B9" stroke-width="1"/><line x1="860" y1="104" x2="860" y2="218" stroke="#CEC6B9" stroke-width="1"/><rect x="20" y="242" width="1160" height="142" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><circle cx="44" cy="268" r="11" fill="#40002D"/><text x="44" y="272.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="76" y="273" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Convidados contra elegíveis não convidados</text><text x="76" y="294" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">quem separou os grupos foi a campanha, não o membro</text><text x="580" y="273.0" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">O convite moveu a substituição de</text><text x="580" y="292.17" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">quem foi convidado?</text><text x="880" y="273.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">O efeito em quem usa: poucos convidados</text><text x="880" y="291.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">aceitam, então o efeito chega diluído.</text><line x1="560" y1="256" x2="560" y2="370" stroke="#CEC6B9" stroke-width="1"/><line x1="860" y1="256" x2="860" y2="370" stroke="#CEC6B9" stroke-width="1"/><rect x="20" y="394" width="1160" height="92" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><circle cx="44" cy="420" r="11" fill="#40002D"/><text x="44" y="424.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="76" y="425" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">KR de substituição na base inteira</text><text x="76" y="446" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">acompanhado na dash do KR, fora desta</text><text x="580" y="425.0" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">A meta da empresa está sendo</text><text x="580" y="444.17" font-size="13.5" fill="#141414" font-weight="600" text-anchor="start">cumprida?</text><text x="880" y="425.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">O papel da Alice AI: soma todos os</text><text x="880" y="443.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">caminhos até o PA Digital.</text><line x1="560" y1="408" x2="560" y2="472" stroke="#CEC6B9" stroke-width="1"/><line x1="860" y1="408" x2="860" y2="472" stroke="#CEC6B9" stroke-width="1"/><rect x="76" y="156" width="200" height="32" rx="6" fill="#E2D7E0"/><text x="88" y="177" font-size="12.5" fill="#690046" font-weight="600" text-anchor="start">linha de base</text><rect x="280" y="156" width="90" height="32" rx="6" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="4 3"/><text x="325" y="177" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">30 dias fora</text><line x1="374" y1="148" x2="374" y2="196" stroke="#BE0380" stroke-width="1.6"/><text x="374" y="210" font-size="11.5" fill="#BE0380" font-weight="700" text-anchor="middle">aceite</text><rect x="380" y="156" width="160" height="32" rx="6" fill="#BE0380"/><text x="392" y="177" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="start">depois, acumulado</text><line x1="300" y1="306" x2="300" y2="356" stroke="#BE0380" stroke-width="1.6"/><text x="306" y="314" font-size="11.5" fill="#BE0380" font-weight="700" text-anchor="start">convite</text><path d="M76,324 L140,320 L200,326 L300,322 L540,322" fill="none" stroke="#BE0380" stroke-width="2.4"/><path d="M76,342 L140,338 L200,344 L300,340 L540,340" fill="none" stroke="#690046" stroke-width="2.4"/><text x="76" y="366" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="start">antes do convite, as linhas andam juntas</text><text x="420" y="314" font-size="11.5" fill="#BE0380" font-weight="600" text-anchor="middle">convidados</text><text x="420" y="358" font-size="11.5" fill="#690046" font-weight="600" text-anchor="middle">não convidados</text><rect x="20" y="500" width="1160" height="72" rx="12" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.4"/><text x="34" y="525.7" font-size="15" fill="#BE0380" font-weight="700" text-anchor="start">Nenhuma das três mede o efeito causal da Alice AI em quem usa</text><text x="34" y="548.2" font-size="13" fill="#333333" font-weight="400" text-anchor="start">Isso pede um braço sorteado, que hoje só existe na recomendação de HS.</text></svg>