<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Linha do tempo de um canal da Alice AI: o trecho da IA, o handoff para a rota seguinte, o que conta como uso e onde começa e termina cada tempo medido." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="600" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><line x1="150" y1="44" x2="640" y2="44" stroke="#6F6F6F" stroke-width="1.1"/><line x1="150" y1="38" x2="150" y2="50" stroke="#6F6F6F" stroke-width="1.1"/><line x1="640" y1="38" x2="640" y2="50" stroke="#6F6F6F" stroke-width="1.1"/><text x="395.0" y="34" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">trecho até o handoff</text><line x1="150" y1="70" x2="1170" y2="70" stroke="#6F6F6F" stroke-width="1.1"/><line x1="150" y1="64" x2="150" y2="76" stroke="#6F6F6F" stroke-width="1.1"/><line x1="1170" y1="64" x2="1170" y2="76" stroke="#6F6F6F" stroke-width="1.1"/><text x="905.0" y="62" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">conversa inteira, da abertura ao arquivamento</text><text x="20" y="115" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Rotas</text><rect x="150" y="92" width="490" height="36" rx="8" fill="#BE0380"/><text x="164" y="115" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="start">Alice AI</text><rect x="640" y="92" width="530" height="36" rx="8" fill="#690046"/><text x="654" y="115" font-size="13.5" fill="#FFFFFF" font-weight="600" text-anchor="start">rota seguinte: time humano</text><line x1="640" y1="84" x2="640" y2="336" stroke="#40002D" stroke-width="1.4" stroke-dasharray="5 4"/><text x="648" y="152" font-size="12.5" fill="#40002D" font-weight="700" text-anchor="start">handoff</text><text x="150" y="152" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">abertura</text><text x="20" y="198" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Mensagens</text><text x="20" y="218" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="start">M: membro</text><text x="20" y="233" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="start">IA: Alice AI</text><text x="20" y="248" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="start">H: humano</text><rect x="163" y="180" width="44" height="26" rx="13" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="185" y="198" font-size="12.5" fill="#141414" font-weight="700" text-anchor="middle">M</text><rect x="243" y="180" width="44" height="26" rx="13" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.2"/><text x="265" y="198" font-size="12.5" fill="#BE0380" font-weight="700" text-anchor="middle">IA</text><rect x="323" y="180" width="44" height="26" rx="13" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="345" y="198" font-size="12.5" fill="#141414" font-weight="700" text-anchor="middle">M</text><rect x="403" y="180" width="44" height="26" rx="13" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.2"/><text x="425" y="198" font-size="12.5" fill="#BE0380" font-weight="700" text-anchor="middle">IA</text><rect x="483" y="180" width="44" height="26" rx="13" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="505" y="198" font-size="12.5" fill="#141414" font-weight="700" text-anchor="middle">M</text><rect x="563" y="180" width="44" height="26" rx="13" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.2"/><text x="585" y="198" font-size="12.5" fill="#BE0380" font-weight="700" text-anchor="middle">IA</text><rect x="713" y="180" width="44" height="26" rx="13" fill="#E2D7E0" stroke="#690046" stroke-width="1.2"/><text x="735" y="198" font-size="12.5" fill="#690046" font-weight="700" text-anchor="middle">H</text><rect x="793" y="180" width="44" height="26" rx="13" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="815" y="198" font-size="12.5" fill="#141414" font-weight="700" text-anchor="middle">M</text><rect x="873" y="180" width="44" height="26" rx="13" fill="#E2D7E0" stroke="#690046" stroke-width="1.2"/><text x="895" y="198" font-size="12.5" fill="#690046" font-weight="700" text-anchor="middle">H</text><rect x="953" y="180" width="44" height="26" rx="13" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="975" y="198" font-size="12.5" fill="#141414" font-weight="700" text-anchor="middle">M</text><rect x="1033" y="180" width="44" height="26" rx="13" fill="#E2D7E0" stroke="#690046" stroke-width="1.2"/><text x="1055" y="198" font-size="12.5" fill="#690046" font-weight="700" text-anchor="middle">H</text><line x1="150" y1="226" x2="265" y2="226" stroke="#40002D" stroke-width="1.4"/><line x1="150" y1="221" x2="150" y2="231" stroke="#40002D" stroke-width="1.4"/><line x1="265" y1="221" x2="265" y2="231" stroke="#40002D" stroke-width="1.4"/><circle cx="207.5" cy="248" r="11" fill="#40002D"/><text x="207.5" y="252.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><line x1="345" y1="226" x2="425" y2="226" stroke="#40002D" stroke-width="1.4"/><line x1="345" y1="221" x2="345" y2="231" stroke="#40002D" stroke-width="1.4"/><line x1="425" y1="221" x2="425" y2="231" stroke="#40002D" stroke-width="1.4"/><circle cx="385.0" cy="248" r="11" fill="#40002D"/><text x="385.0" y="252.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><line x1="640" y1="226" x2="735" y2="226" stroke="#40002D" stroke-width="1.4"/><line x1="640" y1="221" x2="640" y2="231" stroke="#40002D" stroke-width="1.4"/><line x1="735" y1="221" x2="735" y2="231" stroke="#40002D" stroke-width="1.4"/><circle cx="687.5" cy="248" r="11" fill="#40002D"/><text x="687.5" y="252.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><line x1="815" y1="226" x2="895" y2="226" stroke="#40002D" stroke-width="1.4"/><line x1="815" y1="221" x2="815" y2="231" stroke="#40002D" stroke-width="1.4"/><line x1="895" y1="221" x2="895" y2="231" stroke="#40002D" stroke-width="1.4"/><circle cx="855.0" cy="248" r="11" fill="#40002D"/><text x="855.0" y="252.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="20" y="300" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Conta como</text><rect x="150" y="280" width="484" height="36" rx="8" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.2"/><text x="164" y="303" font-size="13" fill="#BE0380" font-weight="600" text-anchor="start">uso da Alice AI: mensagem do membro antes do handoff</text><rect x="646" y="280" width="524" height="36" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.2"/><text x="660" y="303" font-size="13" fill="#333333" font-weight="600" text-anchor="start">uso do Alice Agora, não da Alice AI</text><text x="150" y="342" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">Abrir o canal não é uso: conta o membro mandar mensagem.</text><circle cx="31" cy="387" r="11" fill="#40002D"/><text x="31" y="391.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="52" y="392" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Primeira resposta</text><text x="52" y="412" font-size="13" fill="#333333" font-weight="400" text-anchor="start">abertura do canal até a 1ª resposta da IA</text><circle cx="31" cy="439" r="11" fill="#40002D"/><text x="31" y="443.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="52" y="444" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Tempo entre interações</text><text x="52" y="464" font-size="13" fill="#333333" font-weight="400" text-anchor="start">mensagem do membro até a resposta da IA</text><line x1="22" y1="491" x2="40" y2="491" stroke="#6F6F6F" stroke-width="1.1"/><text x="52" y="496" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Handoff precoce ou tardio</text><text x="52" y="516" font-size="13" fill="#333333" font-weight="400" text-anchor="start">trecho até o handoff ÷ conversa inteira, em tempo e em mensagens</text><circle cx="631" cy="387" r="11" fill="#40002D"/><text x="631" y="391.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="652" y="392" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Do handoff ao humano</text><text x="652" y="412" font-size="13" fill="#333333" font-weight="400" text-anchor="start">saída da IA até a 1ª resposta humana</text><circle cx="631" cy="439" r="11" fill="#40002D"/><text x="631" y="443.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="652" y="444" font-size="14" fill="#141414" font-weight="700" text-anchor="start">Ritmo humano</text><text x="652" y="464" font-size="13" fill="#333333" font-weight="400" text-anchor="start">mensagem do membro até a resposta humana, contra canal que nunca passou pela IA</text><rect x="620" y="488" width="560" height="89" rx="12" fill="#FFFFFF" stroke="#40002D" stroke-width="1.4"/><text x="634" y="512.92" font-size="14" fill="#40002D" font-weight="700" text-anchor="start">Handoff</text><text x="634" y="534.12" font-size="13" fill="#333333" font-weight="400" text-anchor="start">basta existir rota seguinte à da Alice AI, mesmo que o humano não responda;</text><text x="634" y="552.58" font-size="13" fill="#333333" font-weight="400" text-anchor="start">acontece por pedido do membro, guardrail ou timeout da IA</text></svg>