ura</text><circle cx="541.5652173913044" cy="104" r="12" fill="#BE0380"/><text x="541.5652173913044" y="144" font-size="19" fill="#BE0380" font-weight="700" text-anchor="middle">~04/01</text><text x="541.5652173913044" y="170" font-size="17" fill="#141414" font-weight="600" text-anchor="middle">Leitura principal</text><circle cx="978.0" cy="104" r="8" fill="#690046"/><text x="986.0" y="144" font-size="19" fill="#690046" font-weight="700" text-anchor="end">~08/03</text><text x="986.0" y="170" font-size="17" fill="#141414" font-weight="600" text-anchor="end">Custo e desfechos</text></svg>