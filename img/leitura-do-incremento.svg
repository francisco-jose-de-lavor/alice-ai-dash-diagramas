<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="Matriz de leitura do incremento: total de canais contra canais com staff, cada quadrante com o desenho esperado das duas linhas contra o baseline." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="608" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE0380"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#40002D"/></marker></defs><text x="455" y="36" font-size="14.5" fill="#141414" font-weight="700" text-anchor="middle">Canais com staff estáveis ou caindo</text><text x="945" y="36" font-size="14.5" fill="#141414" font-weight="700" text-anchor="middle">Canais com staff subindo junto</text><text x="20" y="168" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Total de canais</text><text x="20" y="188" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">sobe</text><text x="20" y="388" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">Total de canais</text><text x="20" y="408" font-size="14.5" fill="#141414" font-weight="700" text-anchor="start">estável</text><rect x="220" y="56" width="470" height="205" rx="12" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.4"/><text x="240" y="92" font-size="16.5" fill="#BE0380" font-weight="700" text-anchor="start">Incremento, o esperado</text><text x="240" y="120.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">mais demanda atendida com a</text><text x="240" y="138.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">mesma carga humana; a</text><text x="240" y="156.92000000000002" font-size="13" fill="#333333" font-weight="400" text-anchor="start">distância entre as linhas é o</text><text x="240" y="175.38" font-size="13" fill="#333333" font-weight="400" text-anchor="start">ganho</text><line x1="560" y1="86" x2="560" y2="236" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="2 3"/><text x="560" y="252" font-size="11" fill="#6F6F6F" font-weight="400" text-anchor="middle">início</text><line x1="560" y1="136" x2="668" y2="136" stroke="#BE0380" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M482,136 L560,136 L668,98" fill="none" stroke="#BE0380" stroke-width="2.6"/><line x1="560" y1="198" x2="668" y2="198" stroke="#690046" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M482,198 L560,198 L668,198" fill="none" stroke="#690046" stroke-width="2.6"/><rect x="710" y="56" width="470" height="205" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="730" y="92" font-size="16.5" fill="#141414" font-weight="700" text-anchor="start">Carga extra</text><text x="730" y="120.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">a demanda nova chega, mas leva</text><text x="730" y="138.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">atendimento humano junto</text><line x1="1050" y1="86" x2="1050" y2="236" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="2 3"/><text x="1050" y="252" font-size="11" fill="#6F6F6F" font-weight="400" text-anchor="middle">início</text><line x1="1050" y1="136" x2="1158" y2="136" stroke="#BE0380" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M972,136 L1050,136 L1158,98" fill="none" stroke="#BE0380" stroke-width="2.6"/><line x1="1050" y1="198" x2="1158" y2="198" stroke="#690046" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M972,198 L1050,198 L1158,160" fill="none" stroke="#690046" stroke-width="2.6"/><rect x="220" y="276" width="470" height="205" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="240" y="312" font-size="16.5" fill="#141414" font-weight="700" text-anchor="start">Absorção</text><text x="240" y="340.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">a IA passa a atender o que o</text><text x="240" y="358.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">humano atendia, sem demanda</text><text x="240" y="376.92" font-size="13" fill="#333333" font-weight="400" text-anchor="start">nova; com as duas linhas</text><text x="240" y="395.38" font-size="13" fill="#333333" font-weight="400" text-anchor="start">paradas, não há efeito</text><line x1="560" y1="306" x2="560" y2="456" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="2 3"/><text x="560" y="472" font-size="11" fill="#6F6F6F" font-weight="400" text-anchor="middle">início</text><line x1="560" y1="356" x2="668" y2="356" stroke="#BE0380" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M482,356 L560,356 L668,356" fill="none" stroke="#BE0380" stroke-width="2.6"/><line x1="560" y1="418" x2="668" y2="418" stroke="#690046" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M482,418 L560,418 L668,448" fill="none" stroke="#690046" stroke-width="2.6"/><rect x="710" y="276" width="470" height="205" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="730" y="312" font-size="16.5" fill="#141414" font-weight="700" text-anchor="start">Piora</text><text x="730" y="340.0" font-size="13" fill="#333333" font-weight="400" text-anchor="start">a mesma demanda passa a pedir</text><text x="730" y="358.46" font-size="13" fill="#333333" font-weight="400" text-anchor="start">mais atendimento humano</text><line x1="1050" y1="306" x2="1050" y2="456" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="2 3"/><text x="1050" y="472" font-size="11" fill="#6F6F6F" font-weight="400" text-anchor="middle">início</text><line x1="1050" y1="356" x2="1158" y2="356" stroke="#BE0380" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M972,356 L1050,356 L1158,356" fill="none" stroke="#BE0380" stroke-width="2.6"/><line x1="1050" y1="418" x2="1158" y2="418" stroke="#690046" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M972,418 L1050,418 L1158,380" fill="none" stroke="#690046" stroke-width="2.6"/><path d="M220,534 L250,534" fill="none" stroke="#BE0380" stroke-width="2.6"/><text x="258" y="538" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">canais</text><path d="M330,534 L360,534" fill="none" stroke="#690046" stroke-width="2.6"/><text x="368" y="538" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">canais com staff</text><line x1="500" y1="534" x2="530" y2="534" stroke="#6F6F6F" stroke-width="1.3" stroke-dasharray="5 4"/><text x="538" y="538" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">baseline de janeiro a maio</text><text x="220" y="570.0" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">Ler por mil membros ativos: base que cresce sozinha sobe as duas linhas sem ser incremento. O WAU do Alice Agora subindo confirma que a demanda</text><text x="220" y="587.75" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">nova vem de mais membros.</text></svg>