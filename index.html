<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash da Alice AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FAFAFA; --fg: #141414; --muted: #6F6F6F; --brand: #BE0380; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "DM Sans", Helvetica, Arial, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  figure { margin: 0 0 40px; }
  h2 { font-size: 19px; margin: 0 0 4px; color: var(--brand); }
  figcaption { color: var(--muted); margin: 0 0 12px; }
  img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid #E2D7E0; }
</style>
</head>
<body>
<main>
  <h1>Dash da Alice AI</h1>
  <p class="lead">Como ler os números da dash: quem tem acesso, quem entra em cada comparação, onde cada tempo é medido e o papel de cada métrica.</p>
  <figure>
    <h2>1. Quem tem acesso à Alice AI e em que grupo cai</h2>
    <figcaption>Só o sorteio permite ler diferença entre grupos como efeito; no convite, quem aceita escolheu aceitar.</figcaption>
    <img src="img/acesso-e-grupos.png" alt="Quem tem acesso à Alice AI e em que grupo cai">
  </figure>
  <figure>
    <h2>2. Quem entra na comparação de custo</h2>
    <figcaption>Os dois lados abriram canal no mês; o filtro Natureza do custo muda quais capítulos entram no numerador.</figcaption>
    <img src="img/comparacao-de-custo.png" alt="Quem entra na comparação de custo">
  </figure>
  <figure>
    <h2>3. Anatomia de um canal: o que é uso e onde cada relógio corre</h2>
    <figcaption>Uso é mensagem do membro antes do handoff; cada tempo medido começa e termina em um ponto do canal.</figcaption>
    <img src="img/anatomia-do-canal.png" alt="Anatomia de um canal: o que é uso e onde cada relógio corre">
  </figure>
  <figure>
    <h2>4. Como ler o incremento</h2>
    <figcaption>Só o quadrante do incremento confirma a tese: mais canais sem mais canais com staff.</figcaption>
    <img src="img/leitura-do-incremento.png" alt="Como ler o incremento">
  </figure>
  <figure>
    <h2>5. A taxa de resolução da Alice AI só vê os canais que caíram</h2>
    <figcaption>Os contidos não têm desfecho registrado e nunca entram na taxa.</figcaption>
    <img src="img/cobertura-da-resolucao.png" alt="A taxa de resolução da Alice AI só vê os canais que caíram">
  </figure>
  <figure>
    <h2>6. Da conversa à consulta</h2>
    <figcaption>Três funis de indicação sobre o mesmo caminho, com começo e fim diferentes.</figcaption>
    <img src="img/da-conversa-a-consulta.png" alt="Da conversa à consulta">
  </figure>
  <figure>
    <h2>7. Substituição de PS: três comparações, três respostas</h2>
    <figcaption>Nenhuma das três mede o efeito causal da Alice AI em quem usa.</figcaption>
    <img src="img/substituicao-de-ps.png" alt="Substituição de PS: três comparações, três respostas">
  </figure>
  <figure>
    <h2>8. Árvore de métricas do teste da recomendação</h2>
    <figcaption>A principal decide, os guardrails podem pausar e as de substituição explicam o resultado.</figcaption>
    <img src="img/arvore-do-teste.png" alt="Árvore de métricas do teste da recomendação">
  </figure>
</main>
</body>
</html>
